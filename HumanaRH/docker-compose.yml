services:
  postgres:
    image: postgres:17-alpine
    container_name: humanarh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: humanarh
      POSTGRES_USER: humanarh
      POSTGRES_PASSWORD: humanarh_dev
    ports:
      - "5434:5432"
    volumes:
      - humanarh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanarh -d humanarh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  humanarh_postgres_data:
